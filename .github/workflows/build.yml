name: Build Workstation Helper APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source ZIP
        run: unzip -o workstation_helper_prototype.zip

      - name: Find Android resource files
        run: |
          find . -name "accessibility_config.xml"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: workstation_helper
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: workstation-helper-apk
          path: workstation_helper/app/build/outputs/apk/debug/*.apk
